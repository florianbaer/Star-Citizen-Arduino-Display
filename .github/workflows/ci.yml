name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  proto-rust:
    name: Rust proto crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --manifest-path proto/Cargo.toml
      - run: cargo clippy --manifest-path proto/Cargo.toml -- -D warnings

  sender-rust:
    name: Rust sender build
    runs-on: ubuntu-latest
    needs: proto-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo build --manifest-path sender-rs/Cargo.toml
      - run: cargo clippy --manifest-path sender-rs/Cargo.toml -- -D warnings

  msfs-sender-test:
    name: Python MSFS sender (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest pyserial
      - run: ruff check msfs-sender/
      - run: cd msfs-sender && python -m pytest tests/ -v

  msfs-sender-build:
    name: Build MSFS sender (.exe)
    runs-on: windows-latest
    needs: msfs-sender-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pyserial SimConnect

      - name: Build exe with PyInstaller
        working-directory: msfs-sender
        run: pyinstaller msfs_sender.spec

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: msfs-gyro-sender
          path: msfs-sender/dist/msfs-gyro-sender.exe
