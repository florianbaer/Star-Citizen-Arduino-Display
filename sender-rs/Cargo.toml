[package]
name = "hud-sender"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "hud_sender"
path = "src/lib.rs"

[[bin]]
name = "hud-sender"
path = "src/main.rs"

[dependencies]
hud-proto        = { path = "../proto" }
serialport       = "=4.10.1"
clap             = { version = "=4.6.10", features = ["derive"] }
rand             = "=0.8.5"
anyhow           = "=1.0.105"
tonic            = { version = "=0.14.9", default-features = false, features = ["transport", "codegen", "router"] }
tonic-reflection = { version = "=0.14.9", default-features = false }
prost            = "=0.14.6"
prost-types      = "=0.14.6"
tokio            = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-stream     = { version = "=0.1.19", features = ["net"] }
bytes            = "=1.12.2"

[dev-dependencies]
tempfile = "=3.27.0"
